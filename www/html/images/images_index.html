<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:,">  <!-- empty icon -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(150deg, #d993e2, #ffffff);
}

.card {
    background: white;
    width: 700px;
    padding: 40px;
    border-radius: 30px;
    box-shadow: rgba(0, 0, 0, 0.1) 0px 20px 25px -5px,
                rgba(0, 0, 0, 0.04) 0px 10px 10px -5px;
    text-align: center;
}

h1 {
    font-weight: 600;
    margin-bottom: 30px;
    font-size: 30px;
    color: #333;
}

.gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    margin-top: 10px;
}

.image-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #f7f9ff;
    padding: 12px;
    border-radius: 16px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.06);
}

.image-item img {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border-radius: 12px;
    transition: transform 0.2s ease;
}

.image-item img:hover {
    transform: scale(1.05);
}

.filename {
    margin-top: 8px;
    font-size: 14px;
    color: #555;
    text-align: center;
    word-break: break-all;
}

.delete-btn {
    margin-top: 6px;
    border: none;
    border-radius: 10px;
    padding: 6px 12px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff9eb3, #ff6b8a);
    color: white;
    transition: 0.2s ease;
}

.delete-btn:hover {
    transform: translateY(-2px);
}

.home-btn {
    margin-top: 30px;
    padding: 12px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #e29ce7, #a4e1f5);
    color: white;
    font-weight: 600;
    cursor: pointer;
    width: 70%;
    transition: 0.2s ease;
}

.home-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
}

</style>
</head>

<body>

<div class="card">
    <h1>📸 Image Gallery 📸</h1>

    <div class="gallery" id="images">
        <!-- Server injects image items here -->
        <!-- Example:
        <div class="image-item">
            <img src="/images/example.jpg" alt="example">
            <span class="filename">example.jpg</span>
            <button class="delete-btn" onclick="deleteImage('example.jpg')">Delete</button>
        </div>
        -->
    </div>

    <a href="/">
        <button class="home-btn">← Back Home</button>
    </a>
</div>


</body>
</html>
