<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>✨Didi and Goksu's Webserv ✨ — Error</title>

	<style>
		/* Reset */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(150deg, #d993e2, #ffffff);
		}

		.card {
			background: white;
			width: 600px;
			padding: 40px;
			border-radius: 30px;
			box-shadow: rgba(0, 0, 0, 0.1) 0px 20px 25px -5px,
				rgba(0, 0, 0, 0.04) 0px 10px 10px -5px;
			text-align: center;
		}

		.error-icon {
			font-size: 48px;
			margin-bottom: 12px;
			display: block;
		}

		.error-code {
			font-size: 60px;
			font-weight: 700;
			color: #555;
			line-height: 1;
			margin-bottom: 8px;
		}

		h1 {
			font-weight: 600;
			margin-bottom: 10px;
			font-size: 22px;
			color: #333;
		}

		p {
			color: #777;
			font-size: 16px;
			margin-bottom: 30px;
		}

		.divider {
			width: 50px;
			height: 2px;
			border-radius: 99px;
			background: #e0e0e0;
			margin: 0 auto 28px auto;
		}

		.links {
			display: flex;
			justify-content: center;
			gap: 15px;
			flex-wrap: wrap;
		}

		.links a button {
			padding: 10px 29px;
			border: none;
			border-radius: 12px;
			font-weight: 500;
			font-size: 14px;
			cursor: pointer;
			width: 100%;
			transition: 0.2s ease;
			background: linear-gradient(135deg, #e29ce7, #a4e1f5);
			color: white;
			box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
		}

		.links a button:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
		}

		.links a {
			text-decoration: none;
			color: #888;
			font-size: 14px;
			transition: 0.2s ease;
		}

		.home-btn {
			display: inline-block;
			margin-top: 4px;
			padding: 14px 0;
			width: 95%;
			border: none;
			border-radius: 14px;
			background: linear-gradient(135deg, #66cbec, #a4e1f5);
			color: white;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
			transition: 0.2s ease;
			box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
			text-decoration: none;
		}

		.home-btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
		}

		footer {
			margin-top: 30px;
			font-size: 12px;
			color: #aaa;
		}
	</style>
</head>

<body>

	<div class="card">
		<span class="error-icon" id="status-icon">⚠️</span>
		<div class="error-code" id="status-code">{{STATUS_CODE}}</div>
		<h1>{{REASON_PHRASE}}</h1>
		<p>{{DESCRIPTION}}</p>

		<script>
			const icons = { "201": "✅", "204": "🗑️" };
			const code = document.getElementById("status-code").textContent.trim();
			if (icons[code]) document.getElementById("status-icon").textContent = icons[code];
		</script>

		<div class="divider"></div>

		<div id="upload-link"></div>
		<script>
			if (code === "201") {
				document.getElementById("upload-link").innerHTML =
					'<a href="/upload/" class="home-btn" style="margin-bottom:12px;">📁 Go to Uploads</a><br>';
			}
		</script>

		<a href="/" class="home-btn">🏠 Go Back Home</a>

		<footer>
			✨ Running on our custom C++ Webserv ✨
		</footer>
	</div>

</body>

</html>
