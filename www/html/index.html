<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨Didi and Goksu's Webserv ✨</title>

<style>
    /* Reset */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f8e8ff, #e3f6ff);
    }

    .card {
        background: white;
        width: 420px;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    h1 {
        font-weight: 600;
        margin-bottom: 10px;
        font-size: 28px;
        color: #333;
    }

    p {
        color: #777;
        font-size: 14px;
        margin-bottom: 30px;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    input[type="file"] {
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #e0e0e0;
        background: #fafafa;
        cursor: pointer;
    }

    input[type="file"]::file-selector-button {
        background: #d6eaff;
        border: none;
        padding: 8px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 500;
        transition: 0.2s ease;
    }

    input[type="file"]::file-selector-button:hover {
        background: #bcdcff;
    }

    button {
        padding: 14px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #b9fbc0, #a0e7ff);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
    }

    .links {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .links a {
        text-decoration: none;
        color: #888;
        font-size: 14px;
        transition: 0.2s ease;
    }

    .links a:hover {
        color: #333;
    }

    footer {
        margin-top: 30px;
        font-size: 12px;
        color: #aaa;
    }
</style>
</head>

<body>

<div class="card">
    <h1>✨Didi & Goksu's Webserv ✨</h1>
    <p>Minimal upload interface</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Upload File</button>
    </form>

    <div class="links">
        <a href="/upload">Upload & Files</a>
        <a href="/cgi-bin">Run CGI</a>
		<a href="/images">Images</a>
		<a href="/redirect">Redirect Test</a>
        <a href="/">Home</a>
    </div>

    <footer>
        Running on your custom C++ Webserv ✨
    </footer>
</div>

</body>
</html>
