<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:,">  <!-- empty icon -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Didi and Goksu's Webserv ✨</title>

<style>
    /* Reset */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(150deg, #d993e2, #ffffff);
    }

    .card {
        background: white;
        width: 800px;
        padding: 40px;
        border-radius: 30px;
		box-shadow: rgba(0, 0, 0, 0.1) 0px 20px 25px -5px, 
					rgba(0, 0, 0, 0.04) 0px 10px 10px -5px;
        text-align: center;
    }

    h1 {
        font-weight: 600;
        margin-bottom: 10px;
        font-size: 33px;
        color: #333;
    }

    p {
        color: #777;
        font-size: 18px;
        margin-bottom: 30px;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    input[type="file"] {
        padding: 12px;
        border-radius: 12px;
        border: 2px solid #e0e0e0;
        background: #fafafa;
		width: 95%;
        cursor: pointer;
    }

	form {
		display: flex;
		flex-direction: column;
		gap: 20px;
		align-items: center;
	}

    input[type="file"]::file-selector-button {
        background: #d6eaff;
        border: none;
        padding: 8px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 500;
		text-align: center;
		width: 50%;
        transition: 0.2s ease;
    }

    input[type="file"]::file-selector-button:hover {
        background: #bcdcff;
    }

    button {
        padding: 14px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #66cbec, #a4e1f5);
		color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
		width: 95%;
        transition: 0.2s ease;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
    }

    .links {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }

	.links a button {
		margin-top: 10px;
		padding: 10px 29px;
		border: none;
		border-radius: 12px;
		font-weight: 500;
		cursor: pointer;
		width: 100%;
		transition: 0.2s ease;
		background: linear-gradient(135deg, #e29ce7, #a4e1f5);
		color: white;

	}

	.links a button:hover {
		transform: translateY(-2px);
		box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
	}

    .links a {
        text-decoration: none;
        color: #888;
        font-size: 14px;
        transition: 0.2s ease;
    }

    .links a:hover {
        color: #333;
    }

    footer {
        margin-top: 30px;
        font-size: 12px;
        color: #aaa;
    }
</style>
</head>

<body>

<div class="card">
    <h1>✨Didi & Goksu's Webserv ✨</h1>
	<p style="margin-bottom: 20px; color: #555;">Welcome to our Webserv!</p>


    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Upload File</button>
    </form>

    <div class="links">
        <a href="/upload"><button>Uploads</button></a>
        <a href="/cgi-bin"><button>Run CGI</button></a>
		<a href="/images"><button>Images</button></a>
		<a href="/redirect"><button>Redirect</button></a>
    </div>

    <footer>
        ✨ Running on our custom C++ Webserv ✨
    </footer>
</div>

</body>
</html>
