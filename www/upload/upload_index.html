<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:,">  <!-- empty icon -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload & Files</title>

<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
		}

	body {
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: linear-gradient(150deg, #d993e2, #ffffff);
	}

	.card {
		background: white;
		width: 600px;
		padding: 40px;
		border-radius: 30px;
		box-shadow: rgba(0, 0, 0, 0.1) 0px 20px 25px -5px,
					rgba(0, 0, 0, 0.04) 0px 10px 10px -5px;
		text-align: center;
	}

	h1 {
		font-weight: 600;
		margin-bottom: 20px;
		font-size: 30px;
		color: #333;
	}

	h2 {
		margin-top: 35px;
		margin-bottom: 15px;
		color: #444;
	}

	form {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 20px;
		width: 100%;
	}

	/* File input container */
	input[type="file"] {
		width: 70%;
		padding: 14px;
		border-radius: 16px;
		border: 2px dashed #cfe8ff;
		background: #f9fcff;
		cursor: pointer;
		text-align: center;
	}

	/* Choose file button */
	input[type="file"]::file-selector-button {
		background: linear-gradient(135deg, #66cbec, #a4e1f5);
		border: none;
		padding: 8px 16px;
		border-radius: 10px;
		cursor: pointer;
		font-weight: 500;
		color: white;
		transition: 0.2s ease;
	}

	input[type="file"]::file-selector-button:hover {
		opacity: 0.85;
	}

	/* Upload button */
	.upload-btn {
		width: 70%;
		padding: 14px;
		border: none;
		border-radius: 14px;
		background: linear-gradient(135deg, #66cbec, #a4e1f5);
		color: white;
		font-size: 15px;
		font-weight: 600;
		cursor: pointer;
		transition: 0.2s ease;
		box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
	}

	.upload-btn:hover {
		transform: translateY(-2px);
		box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
	}

	.file-list {
		margin-top: 10px;
	}

	.file-item {
		display: flex;
		justify-content: space-between;
		align-items: center;
		padding: 12px;
		margin-bottom: 10px;
		background: #f7f9ff;
		border-radius: 14px;
	}

	.file-item span {
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.delete-btn {
		border: none;
		border-radius: 10px;
		padding: 6px 12px;
		cursor: pointer;
		background: linear-gradient(135deg, #ff9eb3, #ff6b8a);
		color: white;
		transition: 0.2s ease;
	}

	.delete-btn:hover {
		transform: translateY(-2px);
	}

	.home-btn {
		margin-top: 30px;
		padding: 12px;
		border: none;
		border-radius: 14px;
		background: linear-gradient(135deg, #e29ce7, #a4e1f5);
		color: white;
		font-weight: 600;
		cursor: pointer;
		width: 70%;
		transition: 0.2s ease;
	}

	.home-btn:hover {
		transform: translateY(-2px);
		box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
	}

</style>
</head>

<body>

<div class="card">

    <h1>⬆️ Upload a File ⬆️</h1>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit" class="upload-btn">Upload File</button>
    </form>

	<!-- File List - server injects items here -->
    <div class="file-list">
        <h2>Uploaded Files - autoindex 🗃️</h2>
        <!-- Server will inject <div class="file-item">...</div> here -->
		<div id="files"></div>
    </div>

	<!-- Back Home -->
    <a href="/">
        <button class="home-btn">← Back Home</button>
    </a>

</div>

<script>
function deleteFile(filename) {
    fetch('/upload/' + encodeURIComponent(filename), { method: 'DELETE' })
        .then(res => {
            if (res.ok) location.reload(); // reload page to update autoindex
            else alert('Delete failed');
        });
}
</script>

</body>
</html>
